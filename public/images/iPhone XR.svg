<svg width="821" height="945" viewBox="0 0 821 945" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask to make screen area transparent -->
    <mask id="screenMask">
      <rect width="821" height="945" fill="white"/>
      <!-- Cut out the screen area (below notch) -->
      <rect x="225" y="435" width="371" height="612" rx="35" fill="black"/>
    </mask>
    
    <!-- Filter for phone shadow/effects -->
    <filter id="phoneShadow" x="-50" y="-50" width="921" height="1045" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Phone body with shadow -->
  <g filter="url(#phoneShadow)">
    <!-- Main phone body -->
    <rect x="159" y="118" width="503" height="1000" rx="50" fill="white" stroke="#EEEEEE" stroke-width="2"/>
    
    <!-- Phone body with mask applied (screen area will be transparent) -->
    <rect x="159" y="118" width="503" height="1000" rx="50" fill="white" mask="url(#screenMask)" stroke="#EEEEEE" stroke-width="2"/>
  </g>
  
  <!-- Notch at top -->
  <path d="M300 155 L300 160 L350 160 L350 183 L471 183 L471 160 L521 160 L521 155 Z" fill="white" stroke="#E6E6E6" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Screen border (visible frame around screen) -->
  <rect x="225" y="435" width="371" height="612" rx="35" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
  
  <!-- Top bezel elements (speaker, camera, sensors) -->
  <rect x="357" y="157" width="107" height="9" rx="4.5" fill="#333333" opacity="0.4"/>
  <circle cx="475" cy="151" r="10.5" fill="#313131" opacity="0.5"/>
  <circle cx="480" cy="156" r="5.9" fill="white" opacity="0.5"/>
  <rect x="301" y="157" width="9" height="9" rx="4.5" fill="#333333" opacity="0.5"/>
</svg>

  <rect x="357" y="157" width="107" height="9" rx="4.5" fill="#333333" opacity="0.4"/>
  <circle cx="475" cy="151" r="10.5" fill="#313131" opacity="0.5"/>
  <circle cx="480" cy="156" r="5.9" fill="white" opacity="0.5"/>
  <rect x="301" y="157" width="9" height="9" rx="4.5" fill="#333333" opacity="0.5"/>
</svg>
